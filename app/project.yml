# XcodeGen — Routeva iOS shell (Craft P0)
# Generate: cd app && xcodegen generate && open Routeva.xcodeproj
name: Routeva
options:
  bundleIdPrefix: app.routeva
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Routeva:
    type: application
    platform: iOS
    sources:
      - path: Routeva
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.routeva.client
        INFOPLIST_KEY_CFBundleDisplayName: Routeva
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: []
