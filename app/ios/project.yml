name: Routeva
options:
  bundleIdPrefix: com.yilinglabs
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.6"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  postGenCommand: python3 Scripts/apply-signing-capabilities.py Routeva.xcodeproj/project.pbxproj

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: NV2PNGX854
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    exactVersion: 7.10.0
  Yams:
    url: https://github.com/jpsim/Yams.git
    exactVersion: 6.2.2

targets:
  SharedKit:
    type: framework
    platform: iOS
    sources:
      - Sources/SharedKit
    dependencies:
      - package: Yams
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yilinglabs.routeva.SharedKit
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES

  CoreBridge:
    type: framework
    platform: iOS
    sources:
      - Sources/CoreBridge
    dependencies:
      - target: SharedKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yilinglabs.routeva.CoreBridge
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES

  DataKit:
    type: framework
    platform: iOS
    sources:
      - Sources/DataKit
    dependencies:
      - target: SharedKit
      - package: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yilinglabs.routeva.DataKit
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES

  CoreConfigKit:
    type: framework
    platform: iOS
    sources:
      - Sources/CoreConfigKit
    dependencies:
      - target: SharedKit
      - target: DataKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yilinglabs.routeva.CoreConfigKit
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES

  PacketTunnelBridgeKit:
    type: framework
    platform: iOS
    sources:
      - Sources/PacketTunnelBridgeKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yilinglabs.routeva.PacketTunnelBridgeKit
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES

  RoutevaPacketTunnelSingBox:
    attributes:
      ProvisioningStyle: Automatic
    type: app-extension
    platform: iOS
    sources:
      - Sources/PacketTunnelShared
      - Sources/PacketTunnelSingBox
    dependencies:
      - target: SharedKit
      - target: CoreBridge
      - target: DataKit
      - target: CoreConfigKit
      - target: PacketTunnelBridgeKit
      - framework: Vendor/Libbox.xcframework
      - sdk: UIKit.framework
      - sdk: libresolv.tbd
    entitlements:
      path: Config/RoutevaPacketTunnelSingBox.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
        com.apple.security.application-groups:
          - group.com.yilinglabs.routeva
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.yilinglabs.routeva.shared
    info:
      path: Config/RoutevaPacketTunnelSingBox-Info.plist
      properties:
        CFBundleDisplayName: Routeva sing-box Tunnel
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        RoutevaKeychainAccessGroup: $(AppIdentifierPrefix)com.yilinglabs.routeva.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yilinglabs.routeva.SingBoxTunnel
        PRODUCT_NAME: RoutevaPacketTunnelSingBox
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - NetworkExtension

  Routeva:
    attributes:
      ProvisioningStyle: Automatic
    type: application
    platform: iOS
    sources:
      - Sources/RoutevaApp
    dependencies:
      - target: SharedKit
      - target: CoreBridge
      - target: DataKit
      # The Packet Tunnel extension dynamically links CoreConfigKit. Embed it
      # in the host so its ../../Frameworks runpath resolves before entry.
      - target: CoreConfigKit
      - target: PacketTunnelBridgeKit
      - sdk: CloudKit.framework
      - target: RoutevaPacketTunnelSingBox
        embed: true
    entitlements:
      path: Config/Routeva.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.yilinglabs.routeva
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
        com.apple.security.application-groups:
          - group.com.yilinglabs.routeva
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.yilinglabs.routeva.shared
    info:
      path: Config/Routeva-Info.plist
      properties:
        CFBundleDisplayName: Routeva
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - zh-Hans
          - zh-Hant
          - es
          - pt-BR
          - ja
          - ko
          - de
        RoutevaKeychainAccessGroup: $(AppIdentifierPrefix)com.yilinglabs.routeva.shared
        NSCameraUsageDescription: Routeva uses the camera only when you choose Scan QR to import a subscription.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yilinglabs.routeva
        PRODUCT_NAME: Routeva
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  SharedKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/SharedKitTests
    dependencies:
      - target: SharedKit
      - target: CoreBridge
      - target: DataKit
      - target: CoreConfigKit
      - target: PacketTunnelBridgeKit
      - sdk: libresolv.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yilinglabs.routeva.SharedKitTests
        GENERATE_INFOPLIST_FILE: YES

  RoutevaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/RoutevaUITests
    dependencies:
      - target: Routeva
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yilinglabs.routeva.UITests
        GENERATE_INFOPLIST_FILE: YES

  SingBoxConfigTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/SingBoxConfigTests
    dependencies:
      - target: SharedKit
      - target: DataKit
      - target: CoreConfigKit
      - framework: Vendor/Libbox.xcframework
      - sdk: UIKit.framework
      - sdk: libresolv.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yilinglabs.routeva.SingBoxConfigTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Routeva:
    run:
      config: Debug
      executable: Routeva
      macroExpansion: Routeva
    build:
      targets:
        Routeva: all
        RoutevaPacketTunnelSingBox: all
        SharedKit: all
        CoreBridge: all
        DataKit: all
        CoreConfigKit: all
        PacketTunnelBridgeKit: all
        SharedKitTests: [test]
        SingBoxConfigTests: [test]
    test:
      targets:
        - SharedKitTests
        - SingBoxConfigTests
        - RoutevaUITests
