name: iOS CI

on:
  pull_request:
    paths:
      - "app/ios/**"
      - "LICENSE"
      - "NOTICE"
      - ".github/workflows/ios.yml"
  push:
    branches: ["main"]
    paths:
      - "app/ios/**"
      - "LICENSE"
      - "NOTICE"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

jobs:
  foundation:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Audit public source
        working-directory: app/ios
        run: ./Scripts/audit-public-source.sh
      - name: Swift foundation tests
        working-directory: app/ios
        run: swift test

  simulator-build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned XcodeGen
        run: |
          tools_root="$(mktemp -d)"
          git clone --depth 1 --branch 2.45.4 https://github.com/yonaskolb/XcodeGen.git "$tools_root/XcodeGen"
          swift build --package-path "$tools_root/XcodeGen" -c release
          echo "$tools_root/XcodeGen/.build/release" >> "$GITHUB_PATH"
      - name: Generate unsigned project
        working-directory: app/ios
        run: xcodegen generate --spec project.yml
      - name: Build unsigned Simulator app
        working-directory: app/ios
        run: |
          xcodebuild \
            -project Routeva.xcodeproj \
            -scheme Routeva \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO \
            build
