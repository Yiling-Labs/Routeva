<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Routeva · Screenshot shelf</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./shots.css" />
  <style>
    html, body { height: auto; background: #eceae4; }
    #root { height: auto; min-height: 100vh; }
    .shelf { padding: 48px 32px 80px; max-width: 1480px; margin: 0 auto; }
    .shelf-hero { margin-bottom: 40px; max-width: 40em; }
    .shelf-kicker {
      margin: 0 0 10px;
      font: 650 12px/1.2 var(--ui);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #6a655c;
    }
    .shelf-hero h1 {
      margin: 0;
      font-family: Newsreader, "Times New Roman", serif;
      font-size: 40px;
      font-weight: 500;
      letter-spacing: -0.03em;
      color: #1c1a16;
    }
    .shelf-lede { margin: 12px 0 0; font: 500 16px/1.5 var(--ui); color: #4a463e; }
    .shelf-lede a { color: #1c1a16; }
    .shelf-row { margin-top: 36px; }
    .shelf-row header h2 {
      margin: 0;
      font: 700 18px/1.2 var(--ui);
      letter-spacing: -0.02em;
      color: #1c1a16;
    }
    .shelf-row header p {
      margin: 6px 0 14px;
      font: 500 13px/1.4 var(--ui);
      color: #6a655c;
    }
    .shelf-track {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding-bottom: 8px;
    }
    .shelf-card {
      flex: 0 0 220px;
      height: 476px;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(0,0,0,0.12);
      background: #111;
    }
    .shelf-card .shot {
      transform: scale(0.5116);
      transform-origin: top left;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="./screens.jsx" type="text/babel"></script>
  <script src="./shelf.jsx" type="text/babel"></script>
</body>
</html>
