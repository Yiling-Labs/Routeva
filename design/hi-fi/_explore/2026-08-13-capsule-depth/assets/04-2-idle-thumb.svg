<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e343a"/>
      <stop offset="100%" stop-color="#0b0e11"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6a737c"/>
      <stop offset="42%" stop-color="#3e474f"/>
      <stop offset="100%" stop-color="#2a3138"/>
    </linearGradient>
    <linearGradient id="spec" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="led" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect x="364" y="242" width="296" height="540" rx="148" fill="url(#pill)" filter="url(#shadow)"/>
  <rect x="364" y="242" width="296" height="540" rx="148" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
  <rect x="392" y="262" width="240" height="200" rx="120" fill="url(#spec)"/>
  <circle cx="512" cy="318" r="16" fill="#7fd9b0" opacity="0.28" filter="url(#led)"/>
  <circle cx="512" cy="318" r="7" fill="#eafff4"/>
</svg>
