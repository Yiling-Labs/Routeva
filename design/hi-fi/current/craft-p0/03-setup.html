<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Routeva · First-Run Setup (minimal)</title>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="./icons.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.5/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif;
      background: #c2c2c0;
      background-image: radial-gradient(ellipse at 30% 15%, #d8d8d6 0%, #b6b6b4 50%, #a4a4a2 100%);
      color: #1a1a1a;
      min-height: 100vh;
      padding: 40px 24px 80px;
      -webkit-font-smoothing: antialiased;
    }
    .meta { max-width: 720px; margin: 0 auto 28px; }
    .meta h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.03em; }
    .meta p { font-size: 14px; color: #3a3a3a; margin-top: 8px; line-height: 1.55; max-width: 68ch; }
    .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .tag {
      font-size: 11px; font-weight: 600; letter-spacing: 0.05em;
      border: 1px solid #333; padding: 4px 10px; border-radius: 999px;
      background: rgba(255,255,255,0.4);
    }
    .row {
      display: flex; flex-wrap: wrap; gap: 36px; justify-content: center;
      max-width: 1700px; margin: 0 auto;
    }
    .phone-col { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .lab { font-size: 12px; font-weight: 600; color: #2a2a2a; text-align: center; max-width: 260px; line-height: 1.35; }
    .lab span { display: block; font-weight: 400; color: #555; margin-top: 2px; font-size: 11px; }
    .noise {
      position: absolute; inset: 0; pointer-events: none; opacity: 0.05;
      background-image: radial-gradient(circle at 1px 1px, #000 1px, transparent 0);
      background-size: 4px 4px; mix-blend-mode: overlay;
    }
    .halftone {
      position: absolute; left: 0; right: 0; bottom: 0; height: 40%;
      pointer-events: none; opacity: 0.15;
      background-image: radial-gradient(circle, rgba(255,255,255,0.55) 0.85px, transparent 1.05px);
      background-size: 4.5px 4.5px;
      -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 55%, #000 100%);
      mask-image: linear-gradient(180deg, transparent 0%, #000 55%, #000 100%);
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .spin-ring {
      animation: spin 0.9s linear infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .spin-ring { animation: none; border-top-color: rgba(127,217,176,0.55) !important; border-right-color: rgba(127,217,176,0.55) !important; }
      .toast-exit {
        transition: none !important;
      }
    }
    button:focus-visible {
      outline: 2px solid rgba(127,217,176,0.9);
      outline-offset: 3px;
    }
    .parse-status:focus {
      outline: none;
    }
    .parse-status:focus-visible {
      outline: 2px solid rgba(127,217,176,0.9);
      outline-offset: 4px;
    }
    /* Shared press feedback (canonical contract curve) */
    .press {
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .press:active {
      transform: scale(0.97);
    }
    @media (prefers-reduced-motion: reduce) {
      .press { transition: none !important; }
    }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }
  </style>
</head>
<body>
  <div class="meta">
    <h1>First-run · Minimal setup</h1>
    <p>
      ADR 0019: <strong>Welcome (once) → Home Empty → Add Subscription</strong>.
      No numbered cards. Paste-first import. No custom VPN screen — system alert on first connect.
      Parsing is a modal over Add Subscription.
    </p>
    <div class="tags">
      <span class="tag">ADR 0019</span>
      <span class="tag">LOW BURDEN</span>
      <span class="tag">PASTE FIRST</span>
      <span class="tag">VISUAL SYSTEM</span>
    </div>
  </div>
  <div id="root"></div>

  <script type="text/babel">
    const {
      IconHelp, IconSubscriptions, IconSettings, IconClose, IconQr, IconFile, IconClipboard,
      IconPlus, IconPower, IconAlert, IconCheck, IconMapPin, IconChevron,
      STROKE: ICON_STROKE,
    } = window.RoutevaIcons;
    const ICON_COLOR = 'rgba(255,255,255,0.88)';
    const TYPE = { font: '-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif' };
    const FIELD = 'linear-gradient(168deg, #2e343a 0%, #171c21 42%, #0b0e11 100%)';
    const CTA = 'linear-gradient(160deg, #8fe8c0 0%, #4bb98a 48%, #2f9a6c 100%)';
    const CTA_SH = '0 12px 32px rgba(50,190,130,0.32), inset 0 1px 0 rgba(255,255,255,0.4)';
    /* Text on Field Black — contrast-tuned (secondary ≥ ~5:1, footer/hint ≥ ~4.5:1 est.) */
    const T = {
      primary: 'rgba(255,255,255,0.96)',
      secondary: 'rgba(255,255,255,0.55)',
      muted: 'rgba(255,255,255,0.58)',
      quiet: 'rgba(255,255,255,0.38)',
      icon: 'rgba(255,255,255,0.82)',
    };
    const COPY = {
      noSell: "We don’t sell or recommend providers.",
    };

    function IosFrame({ children }) {
      const c = '#fff';
      return (
        <div style={{
          display: 'inline-block', padding: 11, background: '#0a0a0a', borderRadius: 58,
          boxShadow: '0 0 0 1px #2a2a2a, 0 32px 80px rgba(0,0,0,0.36), inset 0 0 0 1px rgba(255,255,255,0.06)',
        }}>
          <div style={{
            position: 'relative', width: 393, height: 852, borderRadius: 48,
            overflow: 'hidden', background: FIELD,
          }}>
            <div style={{
              position: 'absolute', top: 0, left: 0, right: 0, height: 54, zIndex: 40,
              display: 'flex', alignItems: 'center', justifyContent: 'space-between',
              padding: '14px 28px 0', fontSize: 15, fontWeight: 600, color: c, pointerEvents: 'none',
            }} aria-hidden="true">
              <span>9:41</span>
              <div style={{ display: 'flex', alignItems: 'center', gap: 6, opacity: 0.9 }}>
                <div style={{ display: 'flex', alignItems: 'flex-end', gap: 2, height: 11 }}>
                  {[4, 6, 8, 11].map((h, i) => (
                    <div key={i} style={{ width: 3, height: h, background: c, borderRadius: 1 }} />
                  ))}
                </div>
                <div style={{
                  width: 25, height: 12, border: `1.5px solid ${c}`, borderRadius: 3, padding: 1, position: 'relative',
                }}>
                  <div style={{ width: '78%', height: '100%', background: c, borderRadius: 1 }} />
                </div>
              </div>
            </div>
            <div style={{
              position: 'absolute', top: 11, left: '50%', transform: 'translateX(-50%)',
              width: 120, height: 34, background: '#000', borderRadius: 999, zIndex: 50,
            }} aria-hidden="true" />
            <div style={{ position: 'absolute', inset: 0, paddingTop: 54, paddingBottom: 20 }}>{children}</div>
            <div style={{
              position: 'absolute', bottom: 8, left: '50%', transform: 'translateX(-50%)',
              width: 128, height: 5, borderRadius: 999, background: 'rgba(255,255,255,0.35)', zIndex: 40,
            }} aria-hidden="true" />
          </div>
        </div>
      );
    }

    function GlassOrb({ children, label, onClick }) {
      return (
        <button
          type="button"
          className="press"
          aria-label={label}
          onClick={onClick}
          style={{
            width: 40, height: 40, borderRadius: 999, border: 'none', padding: 0,
            paddingTop: 0.5,
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            cursor: 'pointer', color: T.icon,
            ...glassSurface(),
          }}
        >
          {children}
        </button>
      );
    }

    function Primary({ children, wide }) {
      return (
        <button type="button" className="press" style={{
          border: 'none', cursor: 'pointer', width: wide ? '100%' : undefined,
          padding: '17px 28px', borderRadius: 18, background: CTA, boxShadow: CTA_SH,
          color: '#0a1f18', fontFamily: TYPE.font, fontSize: 16, fontWeight: 800,
        }}>{children}</button>
      );
    }

    function Ghost({ children }) {
      return (
        <button type="button" className="press" style={{
          border: '1px solid rgba(255,255,255,0.14)', cursor: 'pointer', width: '100%',
          padding: '14px 14px 13px', borderRadius: 16, background: 'rgba(255,255,255,0.06)',
          color: 'rgba(255,255,255,0.82)', fontFamily: TYPE.font, fontSize: 15, fontWeight: 600,
          display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 8,
        }}>{children}</button>
      );
    }

    function MapWash() {
      return (
        <div aria-hidden="true" style={{
          position: 'absolute', inset: 0, opacity: 0.07, pointerEvents: 'none',
          backgroundImage: `url("data:image/svg+xml,${encodeURIComponent(`
            <svg xmlns='http://www.w3.org/2000/svg' width='400' height='300'><g fill='none' stroke='#fff' stroke-width='1' opacity='0.4'>
              <ellipse cx='200' cy='148' rx='158' ry='88'/><path d='M42 148 Q100 78 200 98 T358 138'/>
            </g></svg>`)}")`,
          backgroundSize: '130% auto', backgroundPosition: 'center 42%', backgroundRepeat: 'no-repeat',
        }} />
      );
    }

    /* Icons: Lucide via ./icons.js */
    function glassSurface() {
      return {
        background: 'linear-gradient(155deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0.05) 52%, rgba(255,255,255,0.035) 100%)',
        boxShadow: 'inset 0 1px 0 rgba(255,255,255,0.2), inset 0 -0.5px 0 rgba(0,0,0,0.2), 0 8px 22px rgba(0,0,0,0.32), 0 0 0 0.5px rgba(255,255,255,0.1)',
        backdropFilter: 'blur(16px) saturate(1.2)',
        WebkitBackdropFilter: 'blur(16px) saturate(1.2)',
      };
    }
    function HelpPill() {
      return (
        <button
          type="button"
          className="press"
          aria-label="Help"
          style={{
            height: 40, padding: '0 13px 0 10px', borderRadius: 999,
            border: 'none', cursor: 'pointer', color: T.icon,
            display: 'flex', alignItems: 'center', gap: 6,
            ...glassSurface(),
            fontFamily: TYPE.font,
          }}
        >
          <span style={{ display: 'flex', marginTop: 0.5 }}><IconHelp color={ICON_COLOR} /></span>
          <span style={{
            fontSize: 13.5, fontWeight: 600, letterSpacing: '-0.01em',
            color: 'rgba(255,255,255,0.9)', lineHeight: 1, paddingBottom: 0.5,
          }}>
            Help
          </span>
        </button>
      );
    }


    /* ADR 0020 + 0036: Empty = Help+Settings only; Idle+ = Help+Subscriptions+Settings */
    function HomeChrome({ empty }) {
      return (
        <div style={{
          position: 'relative', zIndex: 6, height: 48,
          display: 'flex', justifyContent: 'space-between', alignItems: 'center',
          padding: '8px 22px 0',
        }}>
          <div style={{ display: 'flex', gap: 10, alignItems: 'center' }}>
            <HelpPill />
            {!empty && (
              <GlassOrb label="Subscriptions"><IconSubscriptions color={ICON_COLOR} /></GlassOrb>
            )}
          </div>
          <GlassOrb label="Settings"><IconSettings color={ICON_COLOR} /></GlassOrb>
        </div>
      );
    }

    function Shell({ children, topRight, inert }) {
      return (
        <div
          style={{ height: '100%', position: 'relative', color: '#fff' }}
          inert={inert ? true : undefined}
        >
          <div className="noise" aria-hidden="true" />
          <MapWash />
          <div className="halftone" aria-hidden="true" />
          <div style={{
            position: 'relative', zIndex: 2, height: '100%',
            display: 'flex', flexDirection: 'column', padding: '10px 24px 28px',
          }}>
            <div style={{
              display: 'flex', justifyContent: 'space-between', alignItems: 'center', height: 44,
            }}>
              <div style={{ width: 40 }} aria-hidden="true" />
              {topRight || <div style={{ width: 40 }} aria-hidden="true" />}
            </div>
            {children}
          </div>
        </div>
      );
    }

    /* —— 1 Welcome (once) · low burden: headline + one sub only —— */
    function Welcome() {
      return (
        <IosFrame>
          <div style={{ height: '100%', position: 'relative', color: '#fff' }}>
            <div className="noise" aria-hidden="true" />
            <MapWash />
            <div className="halftone" aria-hidden="true" />

            <div style={{
              position: 'relative', zIndex: 2, height: '100%',
              display: 'flex', flexDirection: 'column',
              padding: '12px 28px 36px',
            }}>
              <div style={{
                marginTop: 8, height: 44,
                display: 'flex', alignItems: 'center',
              }}>
                <span style={{
                  fontSize: 12, fontWeight: 700, letterSpacing: '0.16em',
                  color: T.quiet,
                }}>
                  ROUTEVA
                </span>
              </div>

              <div style={{
                flex: 1,
                display: 'flex',
                flexDirection: 'column',
                justifyContent: 'center',
                paddingBottom: '18%',
                maxWidth: 320,
              }}>
                <h1 style={{
                  margin: 0,
                  fontFamily: TYPE.font,
                  fontSize: 34,
                  fontWeight: 700,
                  letterSpacing: '-0.04em',
                  lineHeight: 1.12,
                  color: T.primary,
                  textWrap: 'balance',
                }}>
                  Paste your subscription.
                  <span style={{
                    display: 'block',
                    marginTop: 6,
                    color: T.primary,
                  }}>
                    We handle the rest.
                  </span>
                </h1>
                <p style={{
                  margin: '20px 0 0',
                  fontFamily: TYPE.font,
                  fontSize: 16,
                  fontWeight: 500,
                  letterSpacing: '-0.01em',
                  lineHeight: 1.45,
                  color: T.secondary,
                  maxWidth: 300,
                }}>
                  Use a link you already have. {COPY.noSell}
                </p>
              </div>

              <Primary wide>Get started</Primary>
            </div>
          </div>
        </IosFrame>
      );
    }

    /* —— 2 Home Empty = same Home chrome, empty state only —— */
    function HomeEmpty() {
      return (
        <IosFrame>
          <div style={{ height: '100%', position: 'relative', color: '#fff' }}>
            <div className="noise" aria-hidden="true" />
            <MapWash />
            <div className="halftone" aria-hidden="true" />
            <HomeChrome empty />

            <div style={{
              position: 'absolute', top: '30%', left: 0, right: 0, zIndex: 2,
              textAlign: 'center', padding: '0 36px', transform: 'translateY(-50%)',
            }}>
              <div style={{
                width: 56, height: 56, borderRadius: 999, margin: '0 auto 20px',
                background: 'linear-gradient(155deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0.04) 100%)',
                border: '1px solid rgba(255,255,255,0.14)',
                boxShadow: '0 12px 28px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.2)',
                display: 'flex', alignItems: 'center', justifyContent: 'center',
              }} aria-hidden="true">
                <IconPlus size={24} stroke={2} color="rgba(127,217,176,0.95)" />
              </div>
              <h1 style={{
                margin: 0, fontSize: 30, fontWeight: 700, letterSpacing: '-0.03em',
                color: T.primary, fontFamily: TYPE.font,
              }}>
                Add subscription
              </h1>
              <p style={{
                margin: '12px 0 0', fontSize: 15, fontWeight: 500,
                color: T.secondary, fontFamily: TYPE.font, lineHeight: 1.4,
              }}>
                Paste a link you already have
              </p>
            </div>

            <div style={{
              position: 'absolute', left: 0, right: 0, bottom: 118, zIndex: 2,
              display: 'flex', flexDirection: 'column', alignItems: 'center',
              opacity: 0.32, pointerEvents: 'none',
            }} aria-hidden="true">
              <div style={{
                width: 80, height: 176, borderRadius: 999,
                background: 'linear-gradient(180deg, rgba(255,255,255,0.1) 0%, rgba(0,0,0,0.4) 100%)',
                boxShadow: 'inset 0 2px 18px rgba(0,0,0,0.5)',
                position: 'relative',
              }}>
                <div style={{
                  position: 'absolute', left: 5, top: 7, width: 70, height: 92, borderRadius: 999,
                  background: 'linear-gradient(165deg, #4a525a 0%, #2a3138 42%, #1a1f24 100%)',
                  boxShadow: 'inset 0 1.5px 0 rgba(255,255,255,0.22)',
                  display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 7,
                }}>
                  <span style={{ fontSize: 11, fontWeight: 800, letterSpacing: '0.12em', color: 'rgba(255,255,255,0.48)' }}>START</span>
                  <IconPower size={22} stroke={2} color="rgba(255,255,255,0.48)" />
                  <div style={{
                    position: 'absolute', top: 13, width: 7, height: 7, borderRadius: '50%',
                    background: 'rgba(40, 70, 50, 0.55)', opacity: 0.45,
                  }} />
                </div>
              </div>
            </div>

            <div style={{ position: 'absolute', left: 28, right: 28, bottom: 36, zIndex: 5 }}>
              <Primary wide>Add subscription</Primary>
            </div>
          </div>
        </IosFrame>
      );
    }

    /* —— 3–5 Add Subscription + optional Parsing modal / fail —— */
    function AddSub({ fail, parsing }) {
      const { useEffect, useRef } = React;
      const parseLabel = parsing === 'qr' ? 'Reading QR code…' : 'Reading from Clipboard…';
      // Unique per source so storyboard frames 4 + 4b never collide
      const parseId = parsing ? `parse-status-label-${parsing}` : 'parse-status-label';
      const statusRef = useRef(null);

      useEffect(() => {
        if (!parsing || !statusRef.current) return;
        // Move focus into the status region so AT announces the load state
        statusRef.current.focus({ preventScroll: true });
      }, [parsing]);

      return (
        <IosFrame>
          <div style={{ height: '100%', position: 'relative' }}>
            <Shell
              inert={!!parsing}
              topRight={
                <GlassOrb label="Close"><IconClose /></GlassOrb>
              }
            >
              {/* Success path: page title. Fail: only error as main heading (no dual titles). */}
              {!fail && (
                <div style={{ marginTop: 8 }}>
                  <h1 style={{
                    margin: 0,
                    fontSize: 28, fontWeight: 700, letterSpacing: '-0.03em',
                    color: T.primary, fontFamily: TYPE.font,
                  }}>
                    Add subscription
                  </h1>
                  <p style={{
                    margin: '12px 0 0', fontSize: 15, fontWeight: 500, lineHeight: 1.5,
                    color: T.secondary, maxWidth: 320, fontFamily: TYPE.font,
                  }}>
                    Get a subscription link or QR from your provider, then paste or scan it here.
                  </p>
                </div>
              )}

              {fail && (
                <div
                  role="alert"
                  style={{
                    marginTop: 20,
                    textAlign: 'center',
                    padding: '8px 4px 0',
                  }}
                >
                  <div style={{
                    width: 52, height: 52, borderRadius: 999, margin: '0 auto 16px',
                    background: 'rgba(255,255,255,0.06)',
                    border: '1px solid rgba(255,255,255,0.1)',
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                  }} aria-hidden="true">
                    <IconAlert size={22} stroke={ICON_STROKE.chrome} color="rgba(255,200,180,0.9)" />
                  </div>
                  <h1 style={{
                    margin: 0, fontSize: 26, fontWeight: 700, letterSpacing: '-0.02em',
                    color: T.primary, fontFamily: TYPE.font,
                  }}>
                    Couldn’t add this
                  </h1>
                  <p style={{
                    margin: '12px auto 0', fontSize: 15, fontWeight: 500, lineHeight: 1.45,
                    color: T.secondary, maxWidth: 280, fontFamily: TYPE.font,
                  }}>
                    Copy a fresh link or QR from your provider, then try again.
                  </p>
                </div>
              )}

              <div style={{ marginTop: fail ? 32 : 48 }}>
                <Primary wide>{fail ? 'Paste again' : 'Paste from Clipboard'}</Primary>
              </div>

              <div style={{
                marginTop: 12, display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10,
              }}>
                <Ghost>
                  <span style={{ color: 'rgba(255,255,255,0.7)', display: 'flex' }}><IconQr /></span>
                  Scan QR
                </Ghost>
                <Ghost>
                  <span style={{ color: 'rgba(255,255,255,0.7)', display: 'flex' }}><IconFile /></span>
                  Import file
                </Ghost>
              </div>

              <div style={{ flex: 1 }} />
              <p style={{
                margin: 0, textAlign: 'center', fontSize: 13, fontWeight: 500,
                color: T.muted, lineHeight: 1.4, fontFamily: TYPE.font,
              }}>
                {fail ? 'Nothing on this device was changed.' : COPY.noSell}
              </p>
            </Shell>

            {/* Parsing = blocking modal over Add Sub */}
            {parsing && (
              <div
                ref={statusRef}
                className="parse-status"
                role="status"
                aria-live="polite"
                aria-busy="true"
                aria-labelledby={parseId}
                tabIndex={-1}
                style={{
                  position: 'absolute', inset: 0, zIndex: 30,
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                  padding: '0 28px',
                  background: 'rgba(4, 8, 12, 0.55)',
                  backdropFilter: 'blur(10px)',
                  WebkitBackdropFilter: 'blur(10px)',
                }}
              >
                <div style={{
                  width: '100%', maxWidth: 300,
                  padding: '28px 24px 26px',
                  borderRadius: 24,
                  background: 'linear-gradient(155deg, rgba(48,56,62,0.97) 0%, rgba(18,22,26,0.99) 100%)',
                  border: '1px solid rgba(255,255,255,0.12)',
                  boxShadow: '0 24px 56px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.12)',
                  display: 'flex', flexDirection: 'column', alignItems: 'center',
                  textAlign: 'center',
                  color: '#fff',
                }}>
                  <div style={{
                    width: 56, height: 56, borderRadius: 999,
                    background: 'linear-gradient(155deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0.04) 100%)',
                    border: '1px solid rgba(255,255,255,0.14)',
                    boxShadow: 'inset 0 1px 0 rgba(255,255,255,0.16)',
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                    position: 'relative',
                    color: 'rgba(255,255,255,0.9)',
                  }} aria-hidden="true">
                    <div
                      className="spin-ring"
                      style={{
                        position: 'absolute', inset: -3, borderRadius: 999,
                        border: '2px solid transparent',
                        borderTopColor: 'rgba(127,217,176,0.9)',
                        borderRightColor: 'rgba(127,217,176,0.22)',
                      }}
                    />
                    {parsing === 'qr' ? <IconQr /> : <IconClipboard />}
                  </div>
                  <div
                    id={parseId}
                    style={{
                      marginTop: 18, fontSize: 17, fontWeight: 700, letterSpacing: '-0.02em',
                      color: T.primary, fontFamily: TYPE.font,
                    }}
                  >
                    {parseLabel}
                  </div>
                </div>
              </div>
            )}
          </div>
        </IosFrame>
      );
    }

    /* —— 6 Success = real Home Idle shell + toast (auto-dismiss 2–3s) —— */
    function HomeIdleToast() {
      const { useState, useEffect } = React;
      const [toast, setToast] = useState('visible'); // visible | leaving | gone
      const flags = [
        { cc: 'za', s: 0.66 }, { cc: 'us', s: 0.86 }, { cc: 'hk', s: 1.24, on: true },
        { cc: 'de', s: 0.86 }, { cc: 'gb', s: 0.66 },
      ];
      useEffect(() => {
        const leave = setTimeout(() => setToast('leaving'), 2500);
        const gone = setTimeout(() => setToast('gone'), 2820);
        return () => { clearTimeout(leave); clearTimeout(gone); };
      }, []);
      return (
        <IosFrame>
          <div style={{ height: '100%', position: 'relative', color: '#fff' }}>
            <div className="noise" aria-hidden="true" />
            <MapWash />
            <div className="halftone" aria-hidden="true" />

            <HomeChrome />

            {/* Stable live region: pre-rendered, only its text updates */}
            <div role="status" aria-live="polite" className="sr-only">
              {toast === 'visible' ? 'Subscription added' : ''}
            </div>

            {toast !== 'gone' && (
              <div
                className="toast-exit"
                aria-hidden="true"
                style={{
                  position: 'absolute', top: 62, left: 20, right: 20, zIndex: 40,
                  padding: '14px 16px', borderRadius: 18,
                  background: 'linear-gradient(155deg, rgba(40,48,52,0.96) 0%, rgba(18,22,26,0.98) 100%)',
                  border: '1px solid rgba(127,217,176,0.35)',
                  boxShadow: '0 16px 40px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.1)',
                  display: 'flex', alignItems: 'center', gap: 12,
                  opacity: toast === 'leaving' ? 0 : 1,
                  transform: toast === 'leaving' ? 'translateY(-8px)' : 'translateY(0)',
                  transition: 'opacity 0.35s cubic-bezier(0.22, 1, 0.36, 1), transform 0.35s cubic-bezier(0.22, 1, 0.36, 1)',
                  pointerEvents: 'none',
                }}
              >
                <div style={{
                  width: 28, height: 28, borderRadius: 999, flexShrink: 0,
                  background: 'rgba(80,200,150,0.2)',
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                }} aria-hidden="true">
                  <IconCheck size={14} stroke={2} color="#7fd9b0" />
                </div>
                <div>
                  <div style={{ fontSize: 14, fontWeight: 700, color: T.primary, fontFamily: TYPE.font }}>
                    Subscription added
                  </div>
                  <div style={{ marginTop: 2, fontSize: 12, fontWeight: 500, color: T.secondary, fontFamily: TYPE.font }}>
                    Apex Transit · 42 nodes
                  </div>
                </div>
              </div>
            )}

            <div style={{
              position: 'absolute', top: 118, left: 0, right: 0, zIndex: 2,
              display: 'flex', justifyContent: 'center', alignItems: 'center', gap: 14,
              height: 72,
            }} aria-hidden="true">
              {flags.map((f, i) => (
                <div key={i} style={{
                  width: 48, height: 48, borderRadius: 999, overflow: 'hidden', flexShrink: 0,
                  transform: `scale(${f.s})`,
                  opacity: f.on ? 1 : 0.55,
                  boxShadow: f.on
                    ? '0 0 0 2px rgba(255,255,255,0.45), 0 0 0 5px rgba(255,255,255,0.1), 0 12px 28px rgba(0,0,0,0.4)'
                    : '0 0 0 1px rgba(255,255,255,0.12)',
                  background: '#1a2228',
                }}>
                  <img
                    src={`https://flagcdn.com/w160/${f.cc}.png`}
                    alt=""
                    style={{ width: '100%', height: '100%', objectFit: 'cover', display: 'block', transform: 'scale(1.08)' }}
                  />
                </div>
              ))}
            </div>
            <div style={{
              position: 'absolute', top: 198, left: 0, right: 0, textAlign: 'center', zIndex: 2,
              fontSize: 16, fontWeight: 600, color: 'rgba(255,255,255,0.9)', fontFamily: TYPE.font,
            }}>
              HKG-01 <span style={{ color: T.quiet, fontWeight: 500 }}>· VMess</span>
            </div>

            <div style={{
              position: 'absolute', top: '48%', left: 0, right: 0, textAlign: 'center', zIndex: 2,
              transform: 'translateY(-50%)',
            }}>
              <h1 style={{
                margin: 0, fontSize: 30, fontWeight: 700, letterSpacing: '-0.03em',
                color: T.primary, fontFamily: TYPE.font,
              }}>
                Not Connected
              </h1>
              <button
                type="button"
                className="press"
                aria-label="Location"
                style={{
                  marginTop: 14, display: 'inline-flex', alignItems: 'center', gap: 8,
                  padding: '10px 16px', borderRadius: 999, border: '1px solid rgba(255,255,255,0.14)',
                  background: 'linear-gradient(160deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0.05) 100%)',
                  fontSize: 14, fontWeight: 600, color: 'rgba(255,255,255,0.9)',
                  fontFamily: TYPE.font, cursor: 'pointer',
                }}
              >
                <IconMapPin size={14} stroke={ICON_STROKE.chrome} />
                Location
                <span style={{ opacity: 0.55, display: 'flex' }}><IconChevron size={11} /></span>
              </button>
            </div>

            <div style={{
              position: 'absolute', bottom: 48, left: 0, right: 0,
              display: 'flex', flexDirection: 'column', alignItems: 'center', zIndex: 2,
            }}>
              <div style={{
                width: 80, height: 204, borderRadius: 999,
                background: 'linear-gradient(180deg, rgba(255,255,255,0.12) 0%, rgba(0,0,0,0.45) 100%)',
                boxShadow: 'inset 0 2px 20px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.1)',
                position: 'relative',
              }} aria-hidden="true">
                <div style={{
                  position: 'absolute', left: 5, top: 7, width: 70, height: 104, borderRadius: 999,
                  background: 'linear-gradient(165deg, #4a525a 0%, #2a3138 42%, #1a1f24 100%)',
                  boxShadow: '0 14px 34px rgba(0,0,0,0.48), inset 0 1.5px 0 rgba(255,255,255,0.28), inset 0 -4px 12px rgba(0,0,0,0.4)',
                  display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 8,
                  paddingTop: 10,
                }}>
                  <span style={{ fontSize: 12, fontWeight: 800, letterSpacing: '0.12em', color: '#fff', marginTop: 6 }}>START</span>
                  <IconPower size={24} stroke={2} color="#fff" />
                  <div style={{
                    position: 'absolute', top: 14, width: 7, height: 7, borderRadius: '50%',
                    background: 'rgba(40, 70, 50, 0.65)', opacity: 0.5,
                  }} />
                </div>
              </div>
              <p style={{
                margin: '14px 0 0', fontSize: 13, fontWeight: 500,
                color: T.muted, fontFamily: TYPE.font,
              }}>
                Swipe down to connect
              </p>
            </div>
          </div>
        </IosFrame>
      );
    }

    function App() {
      return (
        <div className="row">
          <div className="phone-col">
            <div className="lab">1 · Welcome<span>Once · headline + sub only</span></div>
            <Welcome />
          </div>
          <div className="phone-col">
            <div className="lab">2 · Home Empty<span>Help + Settings only · Add CTA</span></div>
            <HomeEmpty />
          </div>
          <div className="phone-col">
            <div className="lab">3 · Add Subscription<span>Paste / Scan / File</span></div>
            <AddSub />
          </div>
          <div className="phone-col">
            <div className="lab">4 · Parsing<span>Modal over Add Sub · clipboard</span></div>
            <AddSub parsing="clipboard" />
          </div>
          <div className="phone-col">
            <div className="lab">4b · Parsing (QR)<span>Same modal · QR source</span></div>
            <AddSub parsing="qr" />
          </div>
          <div className="phone-col">
            <div className="lab">5 · Couldn’t add<span>Error is sole title · try again</span></div>
            <AddSub fail />
          </div>
          <div className="phone-col">
            <div className="lab">6 · Home Idle + toast<span>Auto-dismiss 2–3s · not auto-connect</span></div>
            <HomeIdleToast />
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
